name: Deploy to GitHub Pages

# The legacy GitHub Pages URL now only redirects to the new site (M7 cutover).
# It also keeps serving the frozen legacy events.json for any external consumer (Q11).
on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "supabase/legacy/events.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/configure-pages@v5

      # Publish only the redirect pages and the frozen events.json, never the repository.
      - name: Stage site files
        run: |
          set -euo pipefail
          mkdir -p _site
          cp pages/index.html pages/404.html _site/
          cp supabase/legacy/events.json _site/events.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
