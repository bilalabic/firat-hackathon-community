name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      page_url:
        description: Yayınlanan sitenin adresi
        value: ${{ jobs.deploy.outputs.page_url }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Her zaman default branch'in son hali yayınlanır: Issue workflow'u
      # events.json'u yeni commit'lediyse o commit de dahil olur.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/configure-pages@v5

      # Publish only the legacy static site, never the whole repository
      # (docs, future apps and services must not end up on Pages).
      - name: Stage site files
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html style.css script.js events.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
